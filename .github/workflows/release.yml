# Push a tag v<version> (version = [workspace.package] version in Cargo.toml)
# to build every platform (build.yml, APK signed with the release key from
# the repository secrets) and create a DRAFT GitHub release with the
# archives and SHA256SUMS. Nothing becomes public until a maintainer
# publishes the draft by hand (the owner decides when). The Warpzone launcher
# installs from published releases only (packaging/warpzone/baba-port.toml).
# Tag a commit that passed CI. Not yet run on GitHub (docs/STATUS.md, M11).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: tag matches Cargo.toml
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          v=$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml | head -1)
          [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "::error::tag ${GITHUB_REF_NAME} != v$v (Cargo.toml)"; exit 1; }
      - run: scripts/check-no-game-data.sh

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      release: true
    secrets:
      ANDROID_RELEASE_KEY_PEM_B64: ${{ secrets.ANDROID_RELEASE_KEY_PEM_B64 }}
      ANDROID_RELEASE_CERT_DER_B64: ${{ secrets.ANDROID_RELEASE_CERT_DER_B64 }}

  draft:
    name: draft release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: baba-port-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS, descriptor names, no game data
        run: |
          scripts/package.sh --checks-only
          if ls dist/*-debugkey.apk >/dev/null 2>&1; then echo "::error::debug-signed APK in a release"; exit 1; fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft)
          # v0.x (early development) and v1.2.0-rc.1 and the like are prereleases
          # (the Warpzone descriptor has prerelease = true).
          case "$GITHUB_REF_NAME" in v0.*|*-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            dist/baba-port-*.tar.gz dist/baba-port-*.zip dist/baba-port-*.apk dist/SHA256SUMS \
            --title "baba-port ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag "${flags[@]}"
